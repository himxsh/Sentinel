<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">Sentinel</a>
      <nav class="nav">
        <a href="/incidents">Incidents</a>
      </nav>
    </header>

    <main class="hero">
      <h1 class="hero-brand">Sentinel</h1>
      <p class="hero-line">The on-call agent that never forgets — incident state, audit trail, and semantic memory in one CockroachDB cluster.</p>
      <div class="cta-row">
        <button type="button" class="btn btn-signal" id="fireBtn">Fire demo alert</button>
        <a class="btn btn-ghost" href="/incidents">Open incident feed</a>
      </div>
    </main>
  </div>
  <script src="/static/app.js"></script>
  <script>
    document.getElementById("fireBtn").addEventListener("click", function () {
      SentinelUI.fireDemoAlert(this);
    });
  </script>
</body>
</html>
